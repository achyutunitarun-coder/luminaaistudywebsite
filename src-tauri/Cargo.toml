[package]
name = "lumina"
version = "1.0.0"
description = "Lumina — AI Study Platform desktop app"
authors = ["Lumina"]
edition = "2021"

[lib]
name = "lumina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
