name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install supabase CLI
        run: npm install -g supabase@2.109.0

      - name: Deploy all functions (with 409 recovery)
        run: |
          set -e
          FAILED=0
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            [ "$fn" = "_shared" ] && continue
            echo "=== Deploying $fn ==="
            if ! supabase functions deploy "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --use-api --no-verify-jwt 2>&1; then
              # A deployment stuck in "created" state returns 409 "deployment already exists"
              # and blocks all future deploys for that function. Deleting clears the stuck
              # deployment, then we redeploy. Retry at most 3 times.
              RECOVERED=0
              for attempt in 1 2 3; do
                echo "  deploy of $fn failed; attempt $attempt/3 recovery (delete + redeploy)"
                supabase functions delete "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes || true
                if supabase functions deploy "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --use-api --no-verify-jwt 2>&1; then
                  RECOVERED=1
                  break
                fi
                sleep 5
              done
              if [ "$RECOVERED" -ne 1 ]; then
                echo "::error:: Failed to deploy $fn after recovery attempts"
                FAILED=1
              fi
            fi
          done
          exit $FAILED
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
